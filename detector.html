<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fake News Detector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
</head>

<body class="detector-page">

  <!-- HEADER -->
  <header class="detector-header">
    <a href="index.html" class="nav-icon">←</a>
    <h1>Fake News Detector</h1>
    <button class="nav-icon" onclick="clearChat()">🗑️</button>
  </header>

  <!-- MAIN -->
  <main class="detector-main">
    <div class="info-card">
     Welcome to the AI Fake News Detection System, You can either type or paste news,<br>
      or upload an image containing news content for analysis.
    </div>

    <div class="chat-area" id="chatArea"></div>
  </main>

  <!-- INPUT BAR -->
  <footer class="input-bar">
    <label for="imageInput" class="icon-btn">📎</label>

    <input
      id="newsInput"
      type="text"
      placeholder="Paste news text here or upload your image..."
    />

    <button class="send-btn" onclick="sendMessage()">🔎</button>
  </footer>

  <!-- HIDDEN FILE INPUT -->
  <input
    type="file"
    id="imageInput"
    accept="image/*"
    onchange="handleImageUpload(event)"
  />

  <!-- OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="detector.js"></script>
  <script>
  const newsInput = document.getElementById("newsInput");
    
// enter key storke for keyboard 
  newsInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
