<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fake News Detector</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="detector-page">

  <!-- HEADER -->
  <header class="detector-header">
    <a href="index.html" class="nav-icon">←</a>
    <h1>Fake News Detector</h1>
    <button class="nav-icon" onclick="clearChat()">🗑️</button>
  </header>

  <!-- MAIN -->
  <main class="detector-main">

    <div class="info-card">
      <p>
        Paste news text or upload an image containing news content.
        The system will analyze whether it is likely fake or real.
      </p>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea"></div>

  </main>

  <!-- INPUT BAR -->
  <footer class="input-bar">

    <!-- Upload -->
    <label for="imageInput" class="icon-btn" title="Upload image for OCR">📎</label>

    <!-- Text input -->
    <input
      type="text"
      id="newsInput"
      placeholder="Paste news text here or upload an image..."
    />

    <!-- Send -->
    <button class="send-btn" onclick="sendMessage()">➤</button>

  </footer>

  <!-- Hidden file input -->
  <input
    type="file"
    id="imageInput"
    accept="image/*"
    onchange="handleImageUpload(event)"
  />

  <!-- OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- App logic -->
  <script src="detector.js"></script>

</body>
</html>
